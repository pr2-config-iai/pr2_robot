spine_velocity_controller:
  type: "robot_mechanism_controllers/JointGroupVelocityController"
  joints:
    - torso_lift_joint
    - head_pan_joint
    - head_tilt_joint
  gains:
    torso_lift_joint:
      p: 4000000.0
      i: 1000.0
      d: 0
      i_clamp: 1200.0
      i_clamp_max: 1200.0
      i_clamp_min: -1200.0
      antiwindup: true
      pos:
